name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Axiom.slnx

      - name: Build
        run: dotnet build Axiom.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Axiom.slnx -c Release --no-build

      - name: Format
        run: dotnet format Axiom.slnx --verify-no-changes
