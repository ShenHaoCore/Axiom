name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # 集成测试连接的临时 PostgreSQL 实例，仅用于 CI，不保存任何生产凭据。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: axiom_ci_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AXIOM_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=axiom_ci_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Axiom.slnx

      - name: Build
        run: dotnet build Axiom.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Axiom.slnx -c Release --no-build --logger trx --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/**/*.trx
          if-no-files-found: ignore

      - name: Format
        run: dotnet format Axiom.slnx --verify-no-changes

  # Docker 冒烟：Dockerfile/compose 相关改动若破坏镜像构建，在 CI 就能发现而不是部署机。
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - src/Axiom.AuthHub/Dockerfile
          - src/Axiom.ApiGateway/Dockerfile
          - src/Axiom.News.Api/Dockerfile
          - src/Axiom.ReferenceData.Api/Dockerfile
          - src/Axiom.Web/Dockerfile
          - src/Axiom.DbMigrator/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build image (${{ matrix.dockerfile }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
