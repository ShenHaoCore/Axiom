name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # 集成测试连接的临时 PostgreSQL 实例，仅用于 CI，不保存任何生产凭据。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: axiom_ci_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AXIOM_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=axiom_ci_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint frontend
        run: npm run lint --prefix frontend
      - name: Check frontend formatting
        run: npm run format:check --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Axiom.slnx

      - name: Build
        run: dotnet build Axiom.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Axiom.slnx -c Release --no-build

      - name: Format
        run: dotnet format Axiom.slnx --verify-no-changes
