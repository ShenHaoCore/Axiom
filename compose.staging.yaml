# 预发环境覆盖文件：切换 Staging 配置，OpenIddict 证书从宿主机目录挂载。
# 使用方式：docker compose --env-file .env.staging -f compose.yaml -f compose.staging.yaml up -d --build
#
# 与生产差异：观测栈保留宿主机端口便于排障；演示用户同样禁用；HTTPS 元数据校验强制开启。
services:
  authhub:
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      OpenIddict__Certificates__Signing__Path: /certs/signing.pfx
      OpenIddict__Certificates__Signing__Password: ${OPENIDDICT_CERT_PASSWORD:?Set OPENIDDICT_CERT_PASSWORD}
      OpenIddict__Certificates__Encryption__Path: /certs/encryption.pfx
      OpenIddict__Certificates__Encryption__Password: ${OPENIDDICT_CERT_PASSWORD:?Set OPENIDDICT_CERT_PASSWORD}
      AUTH_REQUIRE_HTTPS_METADATA: "true"
      DATA_PROTECTION_KEYS_PATH: /keys
      SeedUser__Password: ""

  reference-data:
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AUTH_REQUIRE_HTTPS_METADATA: "true"

  news-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AUTH_REQUIRE_HTTPS_METADATA: "true"

  gateway:
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AUTH_REQUIRE_HTTPS_METADATA: "true"

  web:
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AUTH_REQUIRE_HTTPS_METADATA: "true"
      DATA_PROTECTION_KEYS_PATH: /keys
